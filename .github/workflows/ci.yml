name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Route types such as LayoutProps are generated by Next, so type-check after typegen.
      - run: npx next typegen && npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
